<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GU World — одежда кланов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400&amp;family=Ma+Shan+Zheng&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A0A}
a{color:#D4B06A}a:hover{color:#F0D08A}
</style>
</helmet>
<div style="width: 3240px; height: 5380px; box-sizing: border-box; padding: 48px; background: #0B0A0A; color: #E6DCC8; font-family: 'IBM Plex Sans Condensed', sans-serif; display: flex; flex-direction: column; gap: 32px">

  <header style="display: flex; align-items: center; gap: 18px">
    <span style="width: 52px; height: 52px; background: #A82E25; color: #F3E6D0; font-family: 'Ma Shan Zheng', serif; font-size: 36px; display: flex; align-items: center; justify-content: center; transform: rotate(-4deg)">衣</span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Oranienbaum', serif; font-weight: 400; font-size: 44px; line-height: 1">Одежда кланов горы Цин Мао — арка 1</h1>
      <span style="font-size: 15px; letter-spacing: 0.16em; color: #A69A86">ТРИ КЛАНА · 19 ОБРАЗОВ НА КЛАН: ЗНАТЬ, СТРАЖА, МАСТЕРА ГУ, ПРОСТОЛЮДИНЫ · ВЕКТОРНЫЙ КОНЦЕПТ + ПРОМПТ ДЛЯ ГЕНЕРАТОРА АРТА</span>
    </div>
  </header>

  <sc-for list="{{ clans }}" as="c" hint-placeholder-count="3">
    <div style="display: flex; flex-wrap: wrap; gap: 16px">
      <div style="width: 300px; height: 840px; flex: none; box-sizing: border-box; background: #121214; border: 1px solid {{ c.accent }}; display: flex; flex-direction: column">
        <svg width="298" height="300" viewBox="0 0 300 300" role="img" aria-label="Герб клана">
          <sc-for list="{{ c.crest }}" as="p" hint-placeholder-count="6"><path d="{{ p.d }}" fill="{{ p.f }}" stroke="{{ p.s }}" stroke-width="{{ p.w }}" opacity="{{ p.o }}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for>
        </svg>
        <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1">
          <div style="display: flex; align-items: baseline; gap: 12px">
            <span style="font-family: 'Oranienbaum', serif; font-size: 32px; line-height: 1">{{ c.name }}</span>
            <span style="font-family: 'Ma Shan Zheng', serif; font-size: 28px; color: {{ c.accent }}; line-height: 1">{{ c.glyph }}</span>
          </div>
          <span style="font-size: 15px; line-height: 1.45; color: #CFC4B0">{{ c.motto }}</span>
          <sc-for list="{{ c.rules }}" as="r" hint-placeholder-count="4">
            <div style="display: flex; gap: 10px; font-size: 14px; line-height: 1.4; color: #CFC4B0"><span style="color: {{ c.accent }}">◆</span><span>{{ r }}</span></div>
          </sc-for>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: auto">
            <sc-for list="{{ c.swatches }}" as="sw" hint-placeholder-count="6"><div style="height: 40px; background: {{ sw }}; border: 1px solid #2A2622"></div></sc-for>
          </div>
        </div>
      </div>
      <sc-for list="{{ c.looks }}" as="h" hint-placeholder-count="9">
        <div style="width: 300px; height: 840px; flex: none; box-sizing: border-box; background: #121214; border: 1px solid #26242A; display: flex; flex-direction: column">
          <svg width="298" height="540" viewBox="0 0 300 560" role="img" aria-label="{{ h.name }}">
            <sc-for list="{{ h.parts }}" as="p" hint-placeholder-count="40"><path d="{{ p.d }}" fill="{{ p.f }}" stroke="{{ p.s }}" stroke-width="{{ p.w }}" opacity="{{ p.o }}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for>
          </svg>
          <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Oranienbaum', serif; font-size: 22px; line-height: 1.1">{{ h.name }}</span><span style="font-size: 13px; color: #6E655A">{{ h.num }}</span></div>
            <span style="font-size: 13px; line-height: 1.4; color: #CFC4B0">{{ h.desc }}</span>
            <span style="font-size: 11px; letter-spacing: 0.16em; color: {{ c.accent }}; margin-top: 2px">ПРОМПТ · EN</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; line-height: 1.5; color: #9A8F7E; user-select: text">{{ h.prompt }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3240,"height":5380}}'>
