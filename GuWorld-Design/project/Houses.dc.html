<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GU World — дома кланов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400&amp;family=Ma+Shan+Zheng&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A0A}
a{color:#D4B06A}a:hover{color:#F0D08A}
</style>
</helmet>
<div style="width: 3408px; height: 3880px; box-sizing: border-box; padding: 48px; background: #0B0A0A; color: #E6DCC8; font-family: 'IBM Plex Sans Condensed', sans-serif; display: flex; flex-direction: column; gap: 32px">

  <header style="display: flex; align-items: center; gap: 18px">
    <span style="width: 52px; height: 52px; background: #A82E25; color: #F3E6D0; font-family: 'Ma Shan Zheng', serif; font-size: 36px; display: flex; align-items: center; justify-content: center; transform: rotate(-4deg)">寨</span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Oranienbaum', serif; font-weight: 400; font-size: 44px; line-height: 1">Дома кланов горы Цин Мао — арка 1</h1>
      <span style="font-size: 15px; letter-spacing: 0.16em; color: #A69A86">ТРИ КЛАНА · 13 ЗДАНИЙ НА КЛАН · ВЕКТОРНЫЙ КОНЦЕПТ + ПРОМПТ ДЛЯ ГЕНЕРАТОРА АРТА</span>
    </div>
  </header>

  <sc-for list="{{ clans }}" as="c" hint-placeholder-count="3">
    <div style="display: flex; flex-wrap: wrap; gap: 16px">
      <div style="width: 400px; height: 580px; flex: none; box-sizing: border-box; background: #121214; border: 1px solid {{ c.accent }}; display: flex; flex-direction: column">
        <svg width="398" height="250" viewBox="0 0 400 250" role="img" aria-label="Герб клана">
          <sc-for list="{{ c.crest }}" as="p" hint-placeholder-count="6"><path d="{{ p.d }}" fill="{{ p.f }}" stroke="{{ p.s }}" stroke-width="{{ p.w }}" opacity="{{ p.o }}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for>
        </svg>
        <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1">
          <div style="display: flex; align-items: baseline; gap: 12px">
            <span style="font-family: 'Oranienbaum', serif; font-size: 34px; line-height: 1">{{ c.name }}</span>
            <span style="font-family: 'Ma Shan Zheng', serif; font-size: 30px; color: {{ c.accent }}; line-height: 1">{{ c.glyph }}</span>
          </div>
          <span style="font-size: 15px; line-height: 1.45; color: #CFC4B0">{{ c.motto }}</span>
          <sc-for list="{{ c.rules }}" as="r" hint-placeholder-count="3">
            <div style="display: flex; gap: 10px; font-size: 14px; line-height: 1.4; color: #CFC4B0"><span style="color: {{ c.accent }}">◆</span><span>{{ r }}</span></div>
          </sc-for>
          <div style="display: flex; gap: 6px; margin-top: auto">
            <sc-for list="{{ c.swatches }}" as="sw" hint-placeholder-count="6"><div style="flex: 1; height: 36px; background: {{ sw }}; border: 1px solid #2A2622"></div></sc-for>
          </div>
        </div>
      </div>
      <sc-for list="{{ c.houses }}" as="h" hint-placeholder-count="7">
        <div style="width: 400px; height: 580px; flex: none; box-sizing: border-box; background: #121214; border: 1px solid #26242A; display: flex; flex-direction: column">
          <svg width="398" height="300" viewBox="0 0 400 300" role="img" aria-label="{{ h.name }}">
            <sc-for list="{{ h.parts }}" as="p" hint-placeholder-count="30"><path d="{{ p.d }}" fill="{{ p.f }}" stroke="{{ p.s }}" stroke-width="{{ p.w }}" opacity="{{ p.o }}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for>
          </svg>
          <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 7px; flex: 1; min-height: 0">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Oranienbaum', serif; font-size: 23px; line-height: 1.1">{{ h.name }}</span><span style="font-size: 13px; color: #6E655A">{{ h.num }}</span></div>
            <span style="font-size: 14px; line-height: 1.4; color: #CFC4B0">{{ h.desc }}</span>
            <span style="font-size: 11px; letter-spacing: 0.16em; color: {{ c.accent }}; margin-top: 4px">ПРОМПТ ДЛЯ ГЕНЕРАТОРА · EN</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.5; color: #9A8F7E; user-select: text">{{ h.prompt }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3408,"height":3880}}'>
class Component extends DCLogic {
  renderVals() {
    var OUT = '#08070A';
    var parts = [];
    function P(d, f, s, w, o) { parts.push({ d: d, f: f || 'none', s: s || 'none', w: w || 0, o: o == null ? 1 : o }); }
    function R(x, y, w, h) { return 'M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + (-w) + 'Z'; }
    function C(cx, cy, r) { return 'M' + (cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0Z'; }
    function crescent(cx, cy, r) { var x = cx + 0.436 * r, r2 = 0.9 * r; return 'M' + x + ' ' + (cy - 0.9 * r) + 'A' + r + ' ' + r + ' 0 1 0 ' + x + ' ' + (cy + 0.9 * r) + 'A' + r2 + ' ' + r2 + ' 0 0 1 ' + x + ' ' + (cy - 0.9 * r) + 'Z'; }
    function frost(cx, cy, r) {
      var d = '';
      for (var k = 0; k < 3; k++) {
        var a = k * Math.PI / 3, dx = Math.cos(a) * r, dy = Math.sin(a) * r;
        d += 'M' + (cx - dx) + ' ' + (cy - dy) + 'L' + (cx + dx) + ' ' + (cy + dy);
      }
      for (var j = 0; j < 6; j++) {
        var b = j * Math.PI / 3, px = cx + Math.cos(b) * r * 0.6, py = cy + Math.sin(b) * r * 0.6;
        var l = b + 0.6, m = b - 0.6;
        d += 'M' + (px + Math.cos(l) * r * 0.28) + ' ' + (py + Math.sin(l) * r * 0.28) + 'L' + px + ' ' + py + 'L' + (px + Math.cos(m) * r * 0.28) + ' ' + (py + Math.sin(m) * r * 0.28);
      }
      return d;
    }
    function claw(cx, cy, r) {
      var d = '';
      for (var i = -1; i <= 1; i++) {
        var x = cx + i * r * 0.5;
        d += 'M' + (x - r * 0.25) + ' ' + (cy - r) + 'Q' + (x + r * 0.25) + ' ' + cy + ' ' + (x - r * 0.1) + ' ' + (cy + r);
      }
      return d;
    }
    function emblem(cl, cx, cy, r, color) {
      if (cl.id === 'gy') P(crescent(cx, cy, r), color, OUT, r > 20 ? 2 : 0.8);
      else if (cl.id === 'bai') P(frost(cx, cy, r), 'none', color, Math.max(1.4, r * 0.14));
      else P(claw(cx, cy, r), 'none', color, Math.max(1.6, r * 0.22));
    }

    var CL = [
      { id: 'gy', name: 'Клан Гу Юэ', glyph: '古月', accent: '#9FB4D6',
        motto: 'Клан полумесяца. Тёмное дерево, сине-серая черепица, круглые «лунные» проходы и серебро.',
        rules: ['Крыши с сильно загнутыми карнизами', 'Полумесяц на коньках, флагах и табличках', 'Фонари холодного лунного света'],
        sky: '#18202C', mount: '#222B39', mist: '#3A4658', ground: '#161B19',
        wall: '#5A4A3C', wood: '#2A1E18', roof: '#2E3746', roofShade: '#1D232E', ridge: '#141820', stone: '#4A4C52',
        banner: '#1F2A44', lantern: '#BFD6F2', glow: '#E8B866', roofType: 'curved', door: 'moon', moon: true },
      { id: 'bai', name: 'Клан Бай', glyph: '白', accent: '#8FD3E8',
        motto: 'Белый клан. Побелённые стены на сером камне, крутые прямые крыши под снегом, холодный голубой свет.',
        rules: ['Строгая геометрия, прямые скаты', 'Снег на крышах, иней на камне', 'Знак — ледяной кристалл'],
        sky: '#1C2430', mount: '#2A3440', mist: '#56636F', ground: '#2C343B',
        wall: '#D4D0C8', wood: '#3A3F46', roof: '#4A535E', roofShade: '#343B45', ridge: '#262B32', stone: '#6A7078',
        banner: '#DDE6EC', lantern: '#9FE0F0', glow: '#BFE8F4', roofType: 'straight', door: 'rect', snow: true },
      { id: 'xiong', name: 'Клан Сюн', glyph: '熊', accent: '#D0703E',
        motto: 'Клан медведя. Брёвна на валунах, толстая соломенная кровля, черепа и рога, следы когтей.',
        rules: ['Тяжёлые бревенчатые стены', 'Солома и кора вместо черепицы', 'Красная охра, бронза, огонь'],
        sky: '#211B19', mount: '#2E2622', mist: '#4A3E36', ground: '#1E1813',
        wall: '#6B4A30', wood: '#3A2616', roof: '#6A5530', roofShade: '#4A3A1F', ridge: '#2E2314', stone: '#57524A',
        banner: '#7A2A1C', lantern: '#F0A04A', glow: '#F0A04A', roofType: 'thatch', door: 'wide', logs: true }
    ];

    function background(cl) {
      P(R(0, 0, 400, 300), cl.sky);
      if (cl.moon) { P(C(326, 62, 44), '#C9D2DC', null, 0, 0.06); P(C(326, 62, 24), '#C9D2DC', null, 0, 0.85); }
      if (cl.id === 'xiong') { P(C(80, 70, 50), '#7A3A22', null, 0, 0.12); }
      P('M0 172 L56 124 L110 150 L188 92 L256 142 L322 104 L400 132 V300 H0 Z', cl.mount);
      if (cl.snow) P('M164 112 L188 92 L210 110 L198 106 L188 114 L178 106 Z M304 118 L322 104 L340 116 L330 114 L322 120 Z', '#C9D3DA', null, 0, 0.7);
      P(R(0, 160, 400, 30), cl.mist, null, 0, 0.45);
      P('M0 250 Q200 238 400 250 V300 H0 Z', cl.ground);
      if (cl.snow) P('M20 262 Q60 254 110 262 Q60 268 20 262 Z M260 266 Q320 256 380 266 Q320 272 260 266 Z', '#C9D3DA', null, 0, 0.45);
    }

    function roof(cl, L, Rr, yb, rh, ov, finial) {
      var cx = (L + Rr) / 2, w = Rr - L, ry = yb - rh;
      if (cl.roofType === 'curved') {
        var a = cx - w * 0.24, b = cx + w * 0.24;
        P('M' + (L - ov) + ' ' + (yb - 14) + 'Q' + L + ' ' + (yb + 2) + ' ' + (L + ov * 1.6) + ' ' + yb + 'L' + (Rr - ov * 1.6) + ' ' + yb + 'Q' + Rr + ' ' + (yb + 2) + ' ' + (Rr + ov) + ' ' + (yb - 14) + 'Q' + (Rr - ov * 0.4) + ' ' + (yb - rh * 0.45) + ' ' + b + ' ' + ry + 'L' + a + ' ' + ry + 'Q' + (L + ov * 0.4) + ' ' + (yb - rh * 0.45) + ' ' + (L - ov) + ' ' + (yb - 14) + 'Z', cl.roof, OUT, 1.6);
        var n = Math.max(4, Math.round(w / 11));
        var d = '';
        for (var i = 1; i < n; i++) { var t = i / n; d += 'M' + (L + ov * 1.6 + (w - ov * 3.2) * t) + ' ' + (yb - 1) + 'L' + (a + (b - a) * t) + ' ' + (ry + 2); }
        P(d, 'none', cl.roofShade, 1.3, 0.9);
        P('M' + cx + ' ' + ry + 'L' + b + ' ' + ry + 'Q' + (Rr - ov * 0.4) + ' ' + (yb - rh * 0.45) + ' ' + (Rr + ov) + ' ' + (yb - 14) + 'Q' + Rr + ' ' + (yb + 2) + ' ' + (Rr - ov * 1.6) + ' ' + yb + 'L' + cx + ' ' + yb + 'Z', '#000000', null, 0, 0.22);
        P('M' + (L + ov * 1.6) + ' ' + yb + 'L' + (Rr - ov * 1.6) + ' ' + yb, 'none', cl.ridge, 3);
        P(R(a - 4, ry - 5, b - a + 8, 6), cl.ridge, OUT, 1.2);
        P('M' + (a - 4) + ' ' + (ry - 2) + 'q-8 -2 -10 -12 M' + (b + 4) + ' ' + (ry - 2) + 'q8 -2 10 -12', 'none', cl.ridge, 4);
        P('M' + (L - ov) + ' ' + (yb - 14) + 'l-5 -8 M' + (Rr + ov) + ' ' + (yb - 14) + 'l5 -8', 'none', cl.ridge, 3);
      } else if (cl.roofType === 'straight') {
        var a2 = cx - w * 0.2, b2 = cx + w * 0.2;
        P('M' + (L - ov) + ' ' + yb + 'L' + (Rr + ov) + ' ' + yb + 'L' + b2 + ' ' + ry + 'L' + a2 + ' ' + ry + 'Z', cl.roof, OUT, 1.6);
        var n2 = Math.max(4, Math.round(w / 10)), d2 = '';
        for (var j = 1; j < n2; j++) { var u = j / n2; d2 += 'M' + (L - ov + (w + 2 * ov) * u) + ' ' + (yb - 1) + 'L' + (a2 + (b2 - a2) * u) + ' ' + (ry + 2); }
        P(d2, 'none', cl.roofShade, 1.2, 0.9);
        P('M' + cx + ' ' + ry + 'L' + b2 + ' ' + ry + 'L' + (Rr + ov) + ' ' + yb + 'L' + cx + ' ' + yb + 'Z', '#000000', null, 0, 0.2);
        var s = 0.5, lx = a2 + (L - ov - a2) * s, rx = b2 + (Rr + ov - b2) * s, sy = ry + rh * s;
        P('M' + a2 + ' ' + ry + 'L' + b2 + ' ' + ry + 'L' + rx + ' ' + sy + 'Q' + (cx + w * 0.25) + ' ' + (sy - 8) + ' ' + (cx + w * 0.1) + ' ' + (sy + 2) + 'Q' + cx + ' ' + (sy - 6) + ' ' + (cx - w * 0.12) + ' ' + (sy + 1) + 'Q' + (cx - w * 0.28) + ' ' + (sy - 7) + ' ' + lx + ' ' + sy + 'Z', '#DDE5EA', OUT, 1, 0.95);
        P('M' + (L - ov) + ' ' + yb + 'L' + (Rr + ov) + ' ' + yb, 'none', cl.ridge, 3);
        P(R(a2 - 3, ry - 4, b2 - a2 + 6, 5), cl.ridge, OUT, 1.2);
      } else {
        P('M' + (L - ov) + ' ' + (yb + 4) + 'Q' + (L - ov * 0.6) + ' ' + (yb - rh * 0.75) + ' ' + cx + ' ' + ry + 'Q' + (Rr + ov * 0.6) + ' ' + (yb - rh * 0.75) + ' ' + (Rr + ov) + ' ' + (yb + 4) + 'Q' + cx + ' ' + (yb - 4) + ' ' + (L - ov) + ' ' + (yb + 4) + 'Z', cl.roof, OUT, 1.8);
        var d3 = '';
        for (var k = 0; k < Math.round(w / 6); k++) {
          var x = L - ov + 4 + k * 6, h = 8 + (Math.sin(k * 2.3) + 1) * 5;
          d3 += 'M' + x + ' ' + (yb + 1) + 'l' + ((cx - x) * 0.05) + ' ' + (-h);
        }
        P(d3, 'none', cl.roofShade, 1.4, 0.9);
        P('M' + cx + ' ' + ry + 'Q' + (Rr + ov * 0.6) + ' ' + (yb - rh * 0.75) + ' ' + (Rr + ov) + ' ' + (yb + 4) + 'Q' + (cx + w * 0.3) + ' ' + (yb - 2) + ' ' + cx + ' ' + yb + 'Z', '#000000', null, 0, 0.22);
        P(R(cx - w * 0.18, ry + 2, w * 0.36, 7), cl.ridge, OUT, 1.2);
        P('M' + (cx - w * 0.1) + ' ' + (ry + 1) + 'v9 M' + (cx + w * 0.1) + ' ' + (ry + 1) + 'v9', 'none', '#A08A5A', 2);
      }
      if (finial) {
        if (cl.id === 'gy') P(crescent(cx, ry - 14, 9), '#C9D2DC', OUT, 1);
        else if (cl.id === 'bai') P('M' + cx + ' ' + (ry - 24) + 'L' + (cx + 5) + ' ' + (ry - 5) + 'L' + (cx - 5) + ' ' + (ry - 5) + 'Z', '#BFE8F4', OUT, 1);
        else { P('M' + (cx - 4) + ' ' + (ry + 2) + 'Q' + (cx - 22) + ' ' + (ry - 4) + ' ' + (cx - 18) + ' ' + (ry - 22) + 'M' + (cx + 4) + ' ' + (ry + 2) + 'Q' + (cx + 22) + ' ' + (ry - 4) + ' ' + (cx + 18) + ' ' + (ry - 22), 'none', '#D8CDB8', 4); P(C(cx, ry - 2, 6), '#D8CDB8', OUT, 1); }
      }
      return ry;
    }

    function wall(cl, L, Rr, top, bottom, pillars) {
      var w = Rr - L;
      P(R(L, top, w, bottom - top), cl.wall, OUT, 1.6);
      if (cl.logs) { var d = ''; for (var y = top + 7; y < bottom; y += 8) d += 'M' + L + ' ' + y + 'H' + Rr; P(d, 'none', '#3E2A18', 1.6); d = ''; for (var y2 = top + 7; y2 < bottom; y2 += 8) d += 'M' + (L - 3) + ' ' + y2 + 'a3 3 0 1 0 0.1 0 M' + (Rr + 3) + ' ' + y2 + 'a3 3 0 1 1 -0.1 0'; P(d, '#8A6440', OUT, 0.8); }
      if (cl.snow) { P(R(L, bottom - 14, w, 14), cl.stone, OUT, 1.2); P('M' + (L + 12) + ' ' + (bottom - 14) + 'v14 M' + (L + 34) + ' ' + (bottom - 14) + 'v14 M' + (Rr - 20) + ' ' + (bottom - 14) + 'v14 M' + L + ' ' + (bottom - 7) + 'H' + Rr, 'none', '#4E545B', 1); }
      if (pillars) { var dp = ''; for (var i = 0; i <= pillars; i++) { var x = L + w * i / pillars; dp += R(x - 3, top, 6, bottom - top - (cl.snow ? 14 : 0)); } P(dp, cl.wood, OUT, 1); }
      P(R(L, top, w, 6), cl.wood, OUT, 1);
      P(R(L + w * 0.62, top, w * 0.38, bottom - top), '#000000', null, 0, 0.22);
      P(R(L, top, w, 10), '#000000', null, 0, 0.35);
    }
    function windowAt(cl, x, y, w, h, lit) {
      P(R(x - 2, y - 2, w + 4, h + 4), cl.wood, OUT, 1.2);
      P(R(x, y, w, h), lit ? cl.glow : '#0E0D10', null, 0, lit ? 0.9 : 1);
      var d = 'M' + (x + w / 2) + ' ' + y + 'v' + h + 'M' + x + ' ' + (y + h / 2) + 'h' + w;
      if (cl.id === 'bai') d += 'M' + (x + w / 4) + ' ' + y + 'v' + h + 'M' + (x + 3 * w / 4) + ' ' + y + 'v' + h;
      P(d, 'none', cl.wood, 1.6);
      if (lit) P(C(x + w / 2, y + h / 2, w), cl.glow, null, 0, 0.1);
    }
    function door(cl, cx, bottom, w, h) {
      if (cl.door === 'moon') { var r = h * 0.5; P(C(cx, bottom - r, r + 5), cl.wood, OUT, 1.4); P(C(cx, bottom - r, r), '#0B0B0E', OUT, 1); P(R(cx - r - 6, bottom - 4, 2 * r + 12, 4), cl.stone, OUT, 1); }
      else if (cl.door === 'rect') { P(R(cx - w / 2 - 4, bottom - h - 4, w + 8, h + 4), cl.wood, OUT, 1.4); P(R(cx - w / 2, bottom - h, w, h), '#2A3038', OUT, 1); P('M' + cx + ' ' + (bottom - h) + 'v' + h, 'none', '#141820', 1.6); P(C(cx - 4, bottom - h / 2, 1.6) + C(cx + 4, bottom - h / 2, 1.6), '#BFE8F4'); }
      else { P(R(cx - w / 2 - 5, bottom - h - 5, w + 10, h + 5), '#2A1A0E', OUT, 1.6); P(R(cx - w / 2, bottom - h, w, h), '#4A321C', OUT, 1); P('M' + (cx - w / 2) + ' ' + (bottom - h * 0.55) + 'h' + w + 'M' + cx + ' ' + (bottom - h) + 'v' + h, 'none', '#1E140A', 3); P(C(cx - 6, bottom - h * 0.55, 2.4) + C(cx + 6, bottom - h * 0.55, 2.4), '#B08A4A'); }
    }
    function lantern(cl, x, y) { P('M' + x + ' ' + (y - 16) + 'V' + (y - 7), 'none', OUT, 1.2); P(C(x, y, 16), cl.lantern, null, 0, 0.14); P(C(x, y, 6.5), cl.lantern, OUT, 1.2); P(R(x - 4, y - 8, 8, 2.5) + R(x - 4, y + 6, 8, 2.5), '#151316'); }
    function banner(cl, x, ground, h) {
      P(R(x - 2, ground - h, 4, h), cl.wood, OUT, 1);
      P(C(x, ground - h - 3, 3), '#B08A4A', OUT, 1);
      var fy = ground - h + 6;
      P('M' + (x + 2) + ' ' + fy + 'h28v72l-14 -10l-14 10Z', cl.banner, OUT, 1.2);
      emblem(cl, x + 16, fy + 28, 9, cl.id === 'bai' ? '#5AA7C2' : (cl.id === 'gy' ? '#C9D2DC' : '#E8C27A'));
    }
    function platform(cl, L, Rr, ground, ph) {
      P(R(L, ground - ph, Rr - L, ph), cl.stone, OUT, 1.4);
      var d = 'M' + L + ' ' + (ground - ph / 2) + 'H' + Rr;
      for (var x = L + 18; x < Rr; x += 26) d += 'M' + x + ' ' + (ground - ph) + 'v' + (ph / 2) + 'M' + (x + 13) + ' ' + (ground - ph / 2) + 'v' + (ph / 2);
      P(d, 'none', '#2E3034', 1, 0.8);
