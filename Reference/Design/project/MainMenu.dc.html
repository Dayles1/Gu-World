<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GU World — главное меню</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;family=Ma+Shan+Zheng&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A0A}
a{color:#D4B06A}a:hover{color:#F0D08A}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: #0E1118; color: #E6DCC8; font-family: 'IBM Plex Sans Condensed', sans-serif">
  <svg width="1440" height="810" viewBox="0 0 1440 810" aria-hidden="true" style="position: absolute; inset: 0">
    <rect width="1440" height="810" fill="#10141C"></rect>
    <circle cx="1060" cy="230" r="220" fill="#9FB4D6" opacity="0.05"></circle>
    <circle cx="1060" cy="230" r="120" fill="#9FB4D6" opacity="0.06"></circle>
    <path d="M1097 152 A90 90 0 1 0 1097 308 A81 81 0 0 1 1097 152 Z" fill="#D6DEE8"></path>
    <path d="M0 470 L140 380 L260 430 L420 300 L560 400 L700 330 L860 420 L1000 300 L1160 400 L1300 340 L1440 400 L1440 810 L0 810 Z" fill="#161C26"></path>
    <rect y="420" width="1440" height="60" fill="#3A4658" opacity="0.35"></rect>
    <path d="M0 560 L200 500 L380 540 L560 480 L760 560 L960 500 L1140 560 L1440 510 L1440 810 L0 810 Z" fill="#11161E"></path>
    <g fill="#0C1016"><path d="M900 520 l14 -46 l14 46 Z"></path><path d="M930 524 l18 -60 l18 60 Z"></path><path d="M970 522 l12 -40 l12 40 Z"></path><path d="M1240 530 l16 -52 l16 52 Z"></path><path d="M1270 528 l12 -38 l12 38 Z"></path></g>
    <path d="M1020 520 L1060 508 L1100 520 L1100 546 L1020 546 Z M1110 528 L1140 520 L1170 528 L1170 548 L1110 548 Z" fill="#0A0D12"></path>
    <rect x="1036" y="526" width="9" height="9" fill="#E8B866"></rect><rect x="1070" y="526" width="9" height="9" fill="#BFD6F2"></rect><rect x="1128" y="534" width="8" height="8" fill="#E8B866"></rect>
    <circle cx="1040" cy="530" r="18" fill="#E8B866" opacity="0.14"></circle>
    <rect y="560" width="1440" height="50" fill="#4A5763" opacity="0.18"></rect>
    <path d="M760 810 L800 640 L860 600 L940 610 L1000 680 L1020 810 Z" fill="#07090C"></path>
    <path d="M876 600 l0 -46 q0 -10 6 -12 q6 2 6 12 l0 46 Z" fill="#050608"></path>
    <circle cx="882" cy="534" r="7" fill="#050608"></circle>
    <path d="M877 598 l0 -44 q0 -8 5 -10" stroke="#9FB4D6" stroke-width="1.6" fill="none"></path>
    <path d="M888 540 q22 30 30 70" stroke="#050608" stroke-width="4" fill="none"></path>
    <g fill="#9FB4D6"><circle cx="820" cy="470" r="2"></circle><circle cx="960" cy="440" r="1.6"></circle><circle cx="1180" cy="480" r="2"></circle><circle cx="700" cy="520" r="1.6"></circle></g>
  </svg>
  <div style="position: absolute; inset: 0; box-shadow: inset 0 0 260px 80px rgba(0,0,0,0.9)"></div>
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 620px; background: rgba(8,8,10,0.55)"></div>

  <div style="position: absolute; left: 96px; top: 96px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 18px">
      <span style="width: 68px; height: 68px; background: #A82E25; color: #F3E6D0; font-family: 'Ma Shan Zheng', serif; font-size: 48px; display: flex; align-items: center; justify-content: center; transform: rotate(-4deg); box-shadow: 0 0 0 3px #0B0A0A, 0 0 0 4px #C9A563">蛊</span>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Oranienbaum', serif; font-size: 76px; line-height: 0.95; letter-spacing: 0.06em; color: #EFE6D4">GU WORLD</span>
        <span style="font-family: 'Ma Shan Zheng', serif; font-size: 26px; color: #C9A563; letter-spacing: 0.3em">蛊 · 世 · 界</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 6px"><span style="width: 40px; height: 1px; background: #C9A563"></span><span style="width: 7px; height: 7px; background: #C9A563; transform: rotate(45deg); display: block"></span><span style="font-size: 14px; letter-spacing: 0.3em; color: #A69A86">ГОРА ЦИН МАО</span><span style="width: 7px; height: 7px; background: #C9A563; transform: rotate(45deg); display: block"></span><span style="width: 40px; height: 1px; background: #C9A563"></span></div>
  </div>

  <nav aria-label="Главное меню" style="position: absolute; left: 96px; top: 330px; width: 380px; display: flex; flex-direction: column; gap: 8px">
    <div style="filter: drop-shadow(0 0 16px rgba(216,87,75,0.45))"><button type="button" style="width: 100%; height: 60px; padding: 0; border: none; background: #F0D08A; clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%); cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; gap: 14px; height: 56px; margin: 2px; background: #A8302A; clip-path: polygon(19px 0, calc(100% - 19px) 0, 100% 50%, calc(100% - 19px) 100%, 19px 100%, 0 50%); box-shadow: inset 0 1px 0 #EE7A6C, inset 0 -8px 0 #7A211B; color: #FFF6E6; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600; font-size: 19px; letter-spacing: 0.22em"><span style="width: 7px; height: 7px; background: #F0D08A; transform: rotate(45deg); display: block"></span>ПРОДОЛЖИТЬ<span style="width: 7px; height: 7px; background: #F0D08A; transform: rotate(45deg); display: block"></span></span></button></div>
    <span style="font-size: 13px; color: #A69A86; text-align: center; letter-spacing: 0.08em; margin-bottom: 10px">[ИМЯ ГЕРОЯ] · Ранг 1 · Деревня Гу Юэ · [ВРЕМЯ В ИГРЕ]</span>
    <sc-for list="{{ items }}" as="m" hint-placeholder-count="5">
      <a href="#" style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 20px; text-decoration: none; color: {{ m.fg }}; font-size: 18px; letter-spacing: 0.18em; background: {{ m.bg }}; border-top: 1px solid {{ m.line }}; border-bottom: 1px solid {{ m.line }}">
        <span style="width: 7px; height: 7px; transform: rotate(45deg); display: block; background: {{ m.dot }}"></span>{{ m.label }}<span style="margin-left: auto; font-family: 'Ma Shan Zheng', serif; font-size: 20px; color: {{ m.glyphC }}">{{ m.glyph }}</span>
      </a>
    </sc-for>
  </nav>

  <aside style="position: absolute; right: 64px; bottom: 64px; width: 340px; background: linear-gradient(180deg, #17130F, #0F0D0B); border: 1px solid #4A3E2E; box-shadow: inset 0 0 0 4px #0F0D0B, inset 0 0 0 5px #3A3024, 0 20px 50px rgba(0,0,0,0.6); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
    <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true" style="position: absolute; left: -2px; top: -2px"><path d="M2 46V14Q2 2 14 2H46" stroke="#C9A563" stroke-width="1.6" fill="none"></path><path d="M14 16q8 0 8 8q0 6 -6 6q-4 0 -4 -4" stroke="#C9A563" stroke-width="1.4" fill="none"></path></svg>
    <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; transform: rotate(180deg)"><path d="M2 46V14Q2 2 14 2H46" stroke="#C9A563" stroke-width="1.6" fill="none"></path><path d="M14 16q8 0 8 8q0 6 -6 6q-4 0 -4 -4" stroke="#C9A563" stroke-width="1.4" fill="none"></path></svg>
    <span style="font-size: 12px; letter-spacing: 0.2em; color: #D4B06A">ХРОНИКА</span>
    <span style="font-family: 'Oranienbaum', serif; font-size: 22px; line-height: 1.2">[ЗАГОЛОВОК НОВОСТИ]</span>
    <span style="font-size: 14px; line-height: 1.45; color: #CFC4B0">[Краткий текст об обновлении или событии в мире игры.]</span>
  </aside>
  <span style="position: absolute; left: 96px; bottom: 40px; font-size: 12px; color: #6E655A; letter-spacing: 0.1em">[ВЕРСИЯ]</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hover: 1 }; }
  renderVals() {
    var labels = [['НОВЫЙ ПУТЬ', '始'], ['ЗАГРУЗИТЬ', '续'], ['ЭНЦИКЛОПЕДИЯ ГУ', '典'], ['НАСТРОЙКИ', '设'], ['ВЫХОД', '离']];
    var self = this;
    return { items: labels.map(function (l, i) {
      var on = i === self.state.hover;
      return { label: l[0], glyph: l[1], fg: on ? '#F0D08A' : '#CFC4B0', bg: on ? 'rgba(201,165,99,0.10)' : 'transparent', line: on ? '#6A5A3A' : 'transparent', dot: on ? '#F0D08A' : '#4A3E2E', glyphC: on ? '#C9A563' : '#3A3024' };
    }) };
  }
}
</script>
</body>
</html>
